<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hello, Engineer</title>
<style>
  :root {
    --bg: #07080d;
    --ink: #eceaf4;
    --mute: #8c8aa3;
    --line: rgba(255,255,255,.09);
    --glass: rgba(255,255,255,.04);
    --a: #7c8cff;
    --b: #ff8fb8;
    --c: #5ee0c0;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* ambient background */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 22s ease-in-out infinite alternate; }
  .b1 { width: 46vmax; height: 46vmax; background: var(--a); top: -18vmax; left: -12vmax; }
  .b2 { width: 40vmax; height: 40vmax; background: var(--b); bottom: -16vmax; right: -10vmax; animation-duration: 28s; opacity: .32; }
  .b3 { width: 30vmax; height: 30vmax; background: var(--c); top: 40%; left: 55%; animation-duration: 34s; opacity: .2; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .spot {
    position: fixed; z-index: 1; width: 480px; height: 480px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(124,140,255,.16), transparent 65%);
    transform: translate(-50%, -50%); left: 50%; top: 40%; transition: left .25s ease-out, top .25s ease-out;
  }

  /* card */
  main {
    position: relative; z-index: 2;
    width: 100%; max-width: 620px;
    padding: clamp(28px, 6vw, 52px);
    border: 1px solid var(--line);
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--mute);
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 0 rgba(94,224,192,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(94,224,192,0); } 100% { box-shadow: 0 0 0 0 rgba(94,224,192,0); } }

  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.7rem, 7.2vw, 3.1rem);
    line-height: 1.15;
    letter-spacing: .01em;
    margin: 22px 0 10px;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--a), var(--b) 60%, var(--c));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% 100%; animation: sheen 8s ease-in-out infinite alternate;
  }
  @keyframes sheen { to { background-position: 100% 0; } }
  .lead { color: var(--mute); font-size: 1.05rem; line-height: 1.8; margin: 0 0 28px; }
  .lead b { color: var(--ink); font-weight: 500; }

  /* log block */
  .log {
    font-family: var(--mono); font-size: .82rem; line-height: 1.9;
    border: 1px solid var(--line); border-radius: 16px;
    background: rgba(0,0,0,.28);
    padding: 16px 18px;
    min-height: 168px;
  }
  .log .row { display: flex; gap: 10px; opacity: 0; transform: translateY(4px); animation: in .5s forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .k { color: var(--mute); flex: none; }
  .v { color: var(--ink); word-break: break-all; }
  .path { color: var(--a); }
  .ok { color: var(--c); }
  .pk { color: var(--b); }
  .caret { display: inline-block; width: 7px; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* actions */
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn {
    font: inherit; font-size: .92rem; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink); background: var(--glass);
    transition: transform .2s, background .2s, border-color .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
  .btn.primary {
    border-color: transparent; color: #0a0b12; font-weight: 600;
    background: linear-gradient(100deg, var(--a), var(--b));
    box-shadow: 0 10px 30px -10px rgba(124,140,255,.7);
  }
  .btn.primary:hover { box-shadow: 0 14px 36px -10px rgba(255,143,184,.7); background: linear-gradient(100deg, var(--a), var(--b)); }
  .btn:focus-visible { outline: 2px solid var(--a); outline-offset: 3px; }

  .foot { margin-top: 26px; font-size: .78rem; color: var(--mute); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .foot span:last-child { font-family: var(--mono); }

  /* sparkle */
  .spark { position: fixed; z-index: 5; pointer-events: none; font-size: 1.1rem; animation: float 1.8s ease-out forwards; }
  @keyframes float { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .log .row { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="spot" id="spot" aria-hidden="true"></div>

  <main>
    <span class="eyebrow"><i class="pulse"></i>Hidden page unlocked</span>
    <h1>もしかして...<br>あなたは<br><em>システムエンジニア</em>ですね？</h1>
    <p class="lead">URLを自分で書き換えてここまで来たなら、<br>答えはたぶん <b>YES</b> ですね。<b>同業</b>の方、ようこそ ^^</p>

    <div class="log" id="log" aria-label="アクセスログ風の演出"></div>

    <div class="actions">
      <a class="btn primary" href="/">結婚式・披露宴ご案内ページへ戻る →</a>
    </div>

    <div class="foot">
      <span>結婚披露宴では　お話しできることを楽しみにしております</span>
      <span id="stamp"></span>
    </div>
  </main>

<script>
(function () {
  var log = document.getElementById('log');
  var path = location.pathname + location.search + location.hash;
  if (path.length > 56) path = path.slice(0, 53) + '…';
  var mobile = /Mobile/i.test(navigator.userAgent);
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var rows = [
    ['request', 'path', path],
    ['client', 'v', mobile ? 'mobile browser' : 'desktop browser'],
    ['signal', 'pk', 'URLを手で編集した形跡を検知'],
    ['curiosity', 'ok', 'high'],
    ['status', 'ok', '200 OK — you are one of us']
  ];

  function add(r, idx) {
    var row = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = (reduce ? 0 : idx * 0.45) + 's';
    var k = document.createElement('span'); k.className = 'k'; k.textContent = (r[0] + '          ').slice(0, 10);
    k.style.whiteSpace = 'pre';
    var v = document.createElement('span'); v.className = 'v ' + r[1]; v.textContent = r[2];
    row.appendChild(k); row.appendChild(v);
    if (idx === rows.length - 1) {
      var c = document.createElement('i'); c.className = 'caret'; v.appendChild(c);
    }
    log.appendChild(row);
  }
  rows.forEach(add);

  // timestamp
  var d = new Date();
  document.getElementById('stamp').textContent =
    d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');

  // mouse spotlight
  var spot = document.getElementById('spot');
  addEventListener('pointermove', function (e) { spot.style.left = e.clientX + 'px'; spot.style.top = e.clientY + 'px'; });

  // greet
  document.getElementById('hi').addEventListener('click', function (e) {
    var r = e.currentTarget.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var set = ['✦', '✧', '⌘', '{ }', '</>', '☕', '🐛'];
    for (var i = 0; i < 16; i++) {
      var s = document.createElement('div');
      s.className = 'spark';
      s.textContent = set[Math.floor(Math.random() * set.length)];
      s.style.left = x + 'px'; s.style.top = y + 'px';
      var ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 110;
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist - 30 + 'px');
      document.body.appendChild(s);
      setTimeout((function (el) { return function () { el.remove(); }; })(s), 1900);
    }
  });

  console.log('%cHello, fellow engineer.', 'color:#7c8cff;font-size:16px;font-weight:600');
})();
</script>
</body>
</html>
