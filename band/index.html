
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>10/25 結婚披露宴　バンドメンバーの皆様へ</title>

  <!-- Markdown表示用スタイル -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">

  <!-- Markdown変換ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --paper: #f7f2e7;
      --navy: #0f1b36;
      --gold: #b89a5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--paper);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans JP", "Hiragino Sans", sans-serif;
      line-height: 1.8;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 44px;
      background: #fffdf8;
      border: 1px solid rgba(184, 154, 90, .45);
      box-shadow: 0 12px 40px rgba(15, 27, 54, .06);
    }

    .markdown-body {
      color: var(--navy);
      background: transparent;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      color: var(--navy);
      border-bottom-color: rgba(184, 154, 90, .4);
    }

    .markdown-body a {
      color: #6b1d2e;
    }

    #status {
      text-align: center;
      color: #6b7280;
      padding: 40px 0;
    }

    #status.error {
      color: #9b2638;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 12px;
      }

      main {
        padding: 22px 18px;
      }

      .markdown-body {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main>
    <article id="content" class="markdown-body">
      <p id="status">Markdownを読み込み中...</p>
    </article>
  </main>

  <script>
    (async function () {
      const content = document.getElementById("content");
      const status = document.getElementById("status");

      try {
        // 読み込むMarkdownファイル
        const response = await fetch("./index.md");

        if (!response.ok) {
          throw new Error(
            "mdファイル を読み込めませんでした (" +
            response.status + ")"
          );
        }

        const markdown = await response.text();

        // MarkdownをHTMLに変換して表示
        content.innerHTML = marked.parse(markdown);
      } catch (error) {
        status.classList.add("error");
        status.textContent =
          error.message +
          "。ファイルの配置とWebサーバーの設定を確認してください。";
      }
    })();
  </script>
</body>
</html>
